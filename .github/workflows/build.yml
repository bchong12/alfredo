name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Alfredo claims to run on macOS, Windows and Linux. This is the claim being
# checked: each one installs it, builds it, packages the desktop app, and then
# starts the server and writes to a workspace.
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Types
        run: npx tsc --noEmit
      - name: Components
        run: npx svelte-check --threshold error

      - name: Build
        run: |
          npm run build
          npm run build:server

      - name: Which audio devices ffmpeg would pick
        run: npx tsx scripts/devices.test.mjs

      # The system-audio helper is native code, so the only honest check is a
      # compiler on the platform it is for.
      - name: The system-audio helper compiles and runs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no MSVC on this runner" }
          Write-Host "building with $vs"
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /O2 /EHsc /std:c++17 native\alfredo-audio-win\main.cpp /Fe:alfredo-audio.exe /link ole32.lib"
          if (-not (Test-Path alfredo-audio.exe)) { throw "the helper did not build" }
          # It should say what it heard, write its two files, and finish its
          # wav headers when the pipe closes. A runner has no audio device, so
          # 'mic-only' is the right answer here; a crash would not be.
          $out = "stop" | & .\alfredo-audio.exe record "$env:TEMP\alfredo-rec"
          Write-Host "helper said: $out"
          if ($LASTEXITCODE -ne 0) { throw "the helper exited $LASTEXITCODE" }
          if ($out -notmatch 'done') { throw "the helper did not finish cleanly" }

      - name: The system-audio helper compiles (macOS)
        if: runner.os == 'macOS'
        run: swiftc -O -o /tmp/alfredo-audio native/alfredo-audio/main.swift -framework ScreenCaptureKit -framework AVFoundation -framework CoreMedia -framework CoreGraphics && echo built

      - name: Does it actually run here
        run: node scripts/smoke.mjs

      - name: Package the desktop app
        run: npm run desktop:build:${{ runner.os == 'Windows' && 'win' || runner.os == 'Linux' && 'linux' || 'mac' }}

      - uses: actions/upload-artifact@v4
        with:
          name: alfredo-${{ matrix.os }}
          path: dist-app/*/
          retention-days: 7
          if-no-files-found: error
