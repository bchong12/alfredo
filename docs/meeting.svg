<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect width="1280" height="360" rx="18" fill="#0a0a0a"/>
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <text x="56" y="56" fill="#ededed" font-size="19" font-weight="600">A meeting, end to end</text>
  <text x="56" y="79" fill="#6f6f6f" font-size="13.5">One button. Your voice never reaches anyone else's computer.</text>

  <g transform="translate(56 110)">
    <g>
      <rect width="200" height="120" rx="12" fill="#151515" stroke="#2f2f2f"/>
      <circle cx="32" cy="33" r="7" fill="#e06666"/>
      <text x="50" y="38" fill="#ededed" font-size="14.5" font-weight="600">Transcribe</text>
      <text x="18" y="68" fill="#8a8a8a" font-size="12.5">Records the room and</text>
      <text x="18" y="86" fill="#8a8a8a" font-size="12.5">what the call plays,</text>
      <text x="18" y="104" fill="#8a8a8a" font-size="12.5">into one file.</text>
    </g>
    <line x1="208" y1="60" x2="232" y2="60" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#b)"/>

    <g transform="translate(240 0)">
      <rect width="212" height="120" rx="12" fill="#121212" stroke="#242424"/>
      <text x="18" y="32" fill="#ededed" font-size="14.5" font-weight="600">Parakeet, here</text>
      <text x="18" y="60" fill="#8a8a8a" font-size="12.5">Speech to text on this</text>
      <text x="18" y="78" fill="#8a8a8a" font-size="12.5">Mac. A minute for every</text>
      <text x="18" y="96" fill="#8a8a8a" font-size="12.5">ten of meeting.</text>
    </g>
    <line x1="460" y1="60" x2="484" y2="60" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#b)"/>

    <g transform="translate(492 0)">
      <rect width="212" height="120" rx="12" fill="#121212" stroke="#242424"/>
      <text x="18" y="32" fill="#ededed" font-size="14.5" font-weight="600">The audio goes</text>
      <text x="18" y="60" fill="#8a8a8a" font-size="12.5">The moment there is a</text>
      <text x="18" y="78" fill="#8a8a8a" font-size="12.5">transcript, the recording</text>
      <text x="18" y="96" fill="#8a8a8a" font-size="12.5">is deleted, not archived.</text>
    </g>
    <line x1="712" y1="60" x2="736" y2="60" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#b)"/>

    <g transform="translate(744 0)">
      <rect width="228" height="120" rx="12" fill="#121212" stroke="#242424"/>
      <text x="18" y="32" fill="#ededed" font-size="14.5" font-weight="600">Claude Code writes it up</text>
      <text x="18" y="60" fill="#8a8a8a" font-size="12.5">Summary, decisions, open</text>
      <text x="18" y="78" fill="#8a8a8a" font-size="12.5">questions, action items</text>
      <text x="18" y="96" fill="#8a8a8a" font-size="12.5">with owners and dates.</text>
    </g>
    <line x1="980" y1="60" x2="1004" y2="60" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#b)"/>

    <g transform="translate(1012 0)">
      <rect width="156" height="120" rx="12" fill="#151515" stroke="#2f2f2f"/>
      <text x="18" y="32" fill="#ededed" font-size="14.5" font-weight="600">Saved</text>
      <text x="18" y="60" fill="#8a8a8a" font-size="12.5">Into your own</text>
      <text x="18" y="78" fill="#8a8a8a" font-size="12.5">database, and</text>
      <text x="18" y="96" fill="#8a8a8a" font-size="12.5">into the brain.</text>
    </g>
  </g>

  <g transform="translate(56 264)">
    <rect width="1168" height="62" rx="12" fill="none" stroke="#242424" stroke-dasharray="5 5"/>
    <text x="18" y="26" fill="#ededed" font-size="13.5" font-weight="600">Then it is findable</text>
    <text x="18" y="47" fill="#8a8a8a" font-size="12.5">“What did we decide about the team plan price?” is answered from the meeting, quoting the line where it was decided. No Parakeet? Make a meeting anyway and type the notes.</text>
  </g>
</svg>
